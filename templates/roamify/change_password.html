{% extends 'roamify/base.html' %}

{% block title %}Change Password | Roamify{% endblock %}

{% block content %}
<div class="auth-shell">
    <section class="auth-card">
        <h1 class="auth-title">Change Password</h1>

        <form method="post" class="auth-form-custom">
            {% csrf_token %}

            <div class="auth-field">
                <label for="{{ form.old_password.id_for_label }}">Current Password</label>
                {{ form.old_password }}
            </div>

            <div class="auth-field">
                <label for="{{ form.new_password1.id_for_label }}">New Password</label>
                {{ form.new_password1 }}
            </div>

            <div class="auth-field">
                <label for="{{ form.new_password2.id_for_label }}">Confirm New Password</label>
                {{ form.new_password2 }}
            </div>

            <button type="submit" class="auth-submit-btn">Update Password</button>
        </form>
    </section>
</div>
{% endblock %}
