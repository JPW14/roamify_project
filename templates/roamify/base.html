{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Roamify{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="site-wrapper">
        <header class="site-header">
            <a href="{% url 'roamify:index' %}" class="brand-link">
                <img src="{% static 'images/roamify_icon.png' %}" alt="Roamify Icon" class="brand-logo">
                <span class="brand-name">Roamify</span>
            </a>

            <nav class="site-nav">
                {% if user.is_authenticated %}
                    <a href="{% url 'roamify:post' %}" class="btn btn-primary">Post Destination</a>
                    <a href="{% url 'roamify:logout' %}" class="btn btn-secondary">Log Out</a>
                {% else %}
                    <a href="{% url 'roamify:signup' %}" class="btn btn-primary">Sign Up</a>
                    <a href="{% url 'roamify:login' %}" class="btn btn-secondary">Log In</a>
                {% endif %}
            </nav>
        </header>

        <main class="page-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
