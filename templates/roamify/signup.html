{% extends 'roamify/base.html' %}

{% block title %}Sign Up | Roamify{% endblock %}

{% block content %}
<div class="page-container-narrow">
    <h1 class="section-title">Create Account</h1>

    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Sign Up</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{% url 'roamify:login' %}">Log in</a></p>
</div>
{% endblock %}
