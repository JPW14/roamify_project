{% extends 'roamify/base.html' %}

{% block title %}Post Destination | Roamify{% endblock %}

{% block content %}
<div class="post-shell">
    <section class="post-card">
        <h1 class="post-title">Share a Travel Experience</h1>

        {% if user.is_authenticated %}
            <form method="post" enctype="multipart/form-data" class="post-form-custom">
                {% csrf_token %}

                <div class="post-field post-field-small">
                    <label for="name">Destination</label>
                    <input type="text" id="name" name="name" placeholder="Enter Destination...">
                </div>

                <div class="post-field post-field-small">
                    <label for="location">Location ◉</label>
                    <input type="text" id="location" name="location" placeholder="Enter Destination Location...">
                </div>

                <div class="post-field post-field-small">
                    <label for="category">Category</label>
                    <select id="category" name="category">
                        <option value="landmarks">Landmarks</option>
                        <option value="urban">Urban</option>
                        <option value="beach">Beach</option>
                        <option value="nature">Nature</option>
                    </select>
                </div>

                <div class="post-field">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" placeholder="Enter Description..."></textarea>
                </div>

                <div class="post-image-upload">
                    <label for="image">Destination Image ☐</label>
                    <input type="file" id="image" name="image">
                </div>

                <button type="submit" class="post-submit-btn">Submit</button>
            </form>
        {% else %}
            <div class="login-required-box">
                <p>You need to be logged in to post a destination.</p>
                <a href="{% url 'roamify:login' %}" class="auth-submit-btn">Log In</a>
            </div>
        {% endif %}
    </section>
</div>
{% endblock %}
