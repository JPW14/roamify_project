{% extends 'roamify/base.html' %}

{% block title %}Post Destination | Roamify{% endblock %}

{% block content %}
<div class="page-container-narrow">
    <section class="card post-box">
        <h1 class="section-title">Share a Travel Experience</h1>

        {% if user.is_authenticated %}
            <form method="post" enctype="multipart/form-data" class="post-form">
                {% csrf_token %}

                <p>
                    <label class="form-label" for="name">Destination</label>
                    <input class="form-input" type="text" id="name" name="name" placeholder="Enter destination name">
                </p>

                <p>
                    <label class="form-label" for="location">Location</label>
                    <input class="form-input" type="text" id="location" name="location" placeholder="Enter destination location">
                </p>

                <p>
                    <label class="form-label" for="description">Description</label>
                    <textarea class="form-textarea" id="description" name="description" placeholder="Describe the destination"></textarea>
                </p>

                <p>
                    <label class="form-label" for="image">Destination Image</label>
                    <input class="form-input file-input" type="file" id="image" name="image">
                </p>

                <button type="submit" class="btn btn-primary auth-button">Submit</button>
            </form>
        {% else %}
            <div class="login-required-box">
                <p>You need to be logged in to post a destination.</p>
                <a href="{% url 'roamify:login' %}" class="btn btn-primary">Log In</a>
            </div>
        {% endif %}
    </section>
</div>
{% endblock %}
