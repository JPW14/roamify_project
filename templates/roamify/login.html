{% extends 'roamify/base.html' %}

{% block title %}Login | Roamify{% endblock %}

{% block content %}
<div class="page-container-narrow">
    <h1 class="section-title">Login</h1>

    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}

        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

        <button type="submit" class="btn btn-primary">Log In</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="{% url 'roamify:signup' %}">Sign up</a></p>
</div>
{% endblock %}
